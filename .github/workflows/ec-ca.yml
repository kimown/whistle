name: ECC CA tests
on:
  push:
    branches: [fix/ecc-ca-support]
  pull_request:
    paths:
      - 'lib/https/ca.js'
      - 'lib/https/ec-ca.js'
      - 'test/ec-ca.test.js'
      - '.github/workflows/ec-ca.yml'
jobs:
  ec-ca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check lib/https/ca.js
          node --check lib/https/ec-ca.js
          node --check test/ec-ca.test.js
      - name: Test EC certificate signing
        run: node test/ec-ca.test.js
